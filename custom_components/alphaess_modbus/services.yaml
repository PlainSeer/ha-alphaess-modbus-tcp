write_register:
  name: Write Register
  description: >
    Write a raw value to a supported operational register on one AlphaESS inverter.
    For advanced use. Prefer the inverter entities for charge, discharge and export.
  fields:
    config_entry_id:
      name: AlphaESS configuration entry ID
      description: Required when more than one AlphaESS inverter is loaded.
      selector:
        text: {}
    address:
      name: Address
      description: >
        Supported register address as a decimal integer. For example, 0x0800
        (maximum feed to grid) is 2048.
      required: true
      example: 2048
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: >
        Raw integer to write (0 to 65535). No scale or offset is applied; provide
        the exact register value as documented.
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 65535
          mode: box
